name: Broadway Reference Capture

on:
  workflow_dispatch:
    inputs:
      app:
        description: Catalog app ID
        required: true
        default: calculator
        type: string

permissions:
  contents: read

jobs:
  native-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load app catalog entry
        run: node scripts/broadway-app.mjs "${{ inputs.app }}" >> "$GITHUB_ENV"
      - run: npx playwright install chromium --with-deps
      - name: Build native Broadway runner
        run: docker build --build-arg APP_PACKAGE="$BROADWAY_APP_PACKAGE" --build-arg APP_COMMAND="$BROADWAY_APP_COMMAND" --tag protota-broadway-app containers/broadway
      - name: Start native app
        run: docker run --detach --rm --name protota-broadway-app -p 8085:8085 protota-broadway-app
      - name: Wait for Broadway
        run: until curl --fail --silent http://127.0.0.1:8085/; do sleep 1; done
      - name: Capture native and Protota output
        run: BROADWAY_URL=http://127.0.0.1:8085/ BROADWAY_PRESET_ID="$BROADWAY_PRESET_ID" BROADWAY_VIEWPORT_WIDTH="$BROADWAY_VIEWPORT_WIDTH" BROADWAY_VIEWPORT_HEIGHT="$BROADWAY_VIEWPORT_HEIGHT" npx playwright test tests/broadway-reference.spec.ts
      - name: Upload reference captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-broadway-reference
          path: test-results/
