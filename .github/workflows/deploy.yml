name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      markdown-only: ${{ steps.check.outputs.markdown-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE="origin/$GITHUB_BASE_REF"
          else
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || echo "")
          if [[ -z "$CHANGED" ]]; then
            echo "markdown-only=false" >> "$GITHUB_OUTPUT"
          else
            NON_MD=$(echo "$CHANGED" | grep -v '\.md$' || true)
            if [[ -z "$NON_MD" ]]; then
              echo "markdown-only=true" >> "$GITHUB_OUTPUT"
            else
              echo "markdown-only=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  test:
    needs: check-changes
    if: needs.check-changes.outputs.markdown-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run renderer conformance tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # "Design here, ship there" is only trustworthy if what we emit builds.
  # blueprint-compiler is the authority, so every preset screen must compile.
  blueprint-export:
    needs: check-changes
    if: needs.check-changes.outputs.markdown-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: registry.fedoraproject.org/fedora:45
    steps:
      - name: Install blueprint-compiler and GIR data
        run: dnf install -y --setopt=install_weak_deps=False blueprint-compiler gtk4-devel libadwaita-devel gtksourceview5-devel nodejs npm git

      - uses: actions/checkout@v7

      - run: npm ci

      - name: Export every preset screen to Blueprint
        run: npx tsx scripts/export-blueprint.mjs

      - name: Compile every exported screen
        run: |
          fail=0
          for f in artifacts/blp/*.blp; do
            if ! blueprint-compiler compile "$f" > /dev/null; then
              echo "FAIL $f"
              fail=1
            fi
          done
          exit $fail

  deploy:
    needs: check-changes
    if: needs.check-changes.outputs.markdown-only != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
