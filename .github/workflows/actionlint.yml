name: Workflow lint

on:
  pull_request:
    paths: [".github/workflows/**", ".github/actionlint.yaml"]
  push:
    branches: [main, master, dev, prod]
    paths: [".github/workflows/**", ".github/actionlint.yaml"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate GitHub Actions workflows
        # actionlint v1.7.12 (:latest resolved to this digest on 2026-10-31).
        # Pinned by digest so an upstream tag move cannot change CI (tunaOS#3229).
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color -ignore shellcheck
